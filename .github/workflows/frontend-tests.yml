name: Frontend Tests

on:
  pull_request:
    paths:
      - 'src/frontend/**'
      - 'package-lock.json'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Frontend tests
        run: npm run test:frontend

  may-merge:
    needs: ['tests']
    runs-on: ubuntu-latest
    steps:
      - name: Cleared for merging
        run: echo OK
